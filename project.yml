name: Keepwell
options:
  bundleIdPrefix: com.nimbuswebdesign
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
fileGroups:
  - Keepwell.storekit
  - README.md
targets:
  Keepwell:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Keepwell
    info:
      path: Keepwell/Info.plist
      properties:
        CFBundleDisplayName: Keepwell
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.photography
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: "Keepwell shows your photos and videos so you can choose what to keep and what to delete. Photos you delete go to Recently Deleted for 30 days. Everything stays on your iPhone and nothing is uploaded."
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nimbuswebdesign.keepwell
        PRODUCT_NAME: Keepwell
        INFOPLIST_KEY_CFBundleDisplayName: Keepwell
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  Keepwell:
    build:
      targets:
        Keepwell: all
    run:
      config: Debug
      storeKitConfiguration: Keepwell.storekit
    archive:
      config: Release
